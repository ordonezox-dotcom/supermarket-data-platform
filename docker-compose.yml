services:

  # ============================================================
  # POSTGRESQL - BASE OPERACIONAL
  # ============================================================

  postgres_source:
    image: postgres:16
    container_name: supermarket_postgres_source

    environment:
      POSTGRES_DB: ${SOURCE_DB_NAME}
      POSTGRES_USER: ${SOURCE_DB_USER}
      POSTGRES_PASSWORD: ${SOURCE_DB_PASSWORD}

    ports:
      - "${SOURCE_DB_PORT}:5432"

    volumes:
      - source_db_data:/var/lib/postgresql/data
      - ./sql/source:/docker-entrypoint-initdb.d


  # ============================================================
  # PERMISOS PARA BRONZE / SILVER / GOLD / QUARANTINE
  #
  # Este contenedor se ejecuta una vez al levantar el proyecto.
  # Prepara ./data para que Spark y Airflow puedan compartir
  # lectura y escritura.
  #
  # GID 0 será el grupo compartido:
  #
  # Airflow ya pertenece al grupo 0.
  # Spark será agregado al grupo 0 desde su Dockerfile.
  # ============================================================

  data-permissions:
    image: alpine:3.20
    container_name: supermarket_data_permissions

    user: "0:0"

    volumes:
      - ./data:/opt/spark-data

    command:
      - sh
      - -c
      - |
        mkdir -p /opt/spark-data/bronze
        mkdir -p /opt/spark-data/silver
        mkdir -p /opt/spark-data/gold
        mkdir -p /opt/spark-data/quarantine

        chgrp -R 0 /opt/spark-data
        chmod -R g+rwX /opt/spark-data

        find /opt/spark-data -type d -exec chmod g+s {} \;


  # ============================================================
  # SPARK MASTER
  # ============================================================

  spark-master:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile

    image: supermarket-spark:3.5.1
    container_name: supermarket_spark_master

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master

    environment:
      SPARK_SOURCE_DB_HOST: ${SPARK_SOURCE_DB_HOST}
      SPARK_SOURCE_DB_PORT: ${SPARK_SOURCE_DB_PORT}
      SPARK_SOURCE_DB_NAME: ${SPARK_SOURCE_DB_NAME}
      SPARK_SOURCE_DB_USER: ${SPARK_SOURCE_DB_USER}
      SPARK_SOURCE_DB_PASSWORD: ${SPARK_SOURCE_DB_PASSWORD}

    depends_on:
      data-permissions:
        condition: service_completed_successfully

    ports:
      - "8081:8080"
      - "7077:7077"

    volumes:
      - ./data:/opt/spark-data
      - ./src:/opt/spark-apps
      - spark_ivy:/home/spark/.ivy2


  # ============================================================
  # SPARK WORKER
  # ============================================================

  spark-worker:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile

    image: supermarket-spark:3.5.1
    container_name: supermarket_spark_worker

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077

    environment:
      SPARK_SOURCE_DB_HOST: ${SPARK_SOURCE_DB_HOST}
      SPARK_SOURCE_DB_PORT: ${SPARK_SOURCE_DB_PORT}
      SPARK_SOURCE_DB_NAME: ${SPARK_SOURCE_DB_NAME}
      SPARK_SOURCE_DB_USER: ${SPARK_SOURCE_DB_USER}
      SPARK_SOURCE_DB_PASSWORD: ${SPARK_SOURCE_DB_PASSWORD}

    depends_on:
      data-permissions:
        condition: service_completed_successfully

      spark-master:
        condition: service_started

    ports:
      - "8082:8081"

    volumes:
      - ./data:/opt/spark-data
      - ./src:/opt/spark-apps
      - spark_ivy:/home/spark/.ivy2


  # ============================================================
  # POSTGRESQL - METADATOS DE AIRFLOW
  # ============================================================

  postgres_airflow:
    image: postgres:16
    container_name: supermarket_postgres_airflow

    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow

    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 5


  # ============================================================
  # AIRFLOW INIT
  # ============================================================

  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile

    image: supermarket-airflow:2.10.5
    container_name: supermarket_airflow_init

    depends_on:
      postgres_airflow:
        condition: service_healthy

      data-permissions:
        condition: service_completed_successfully

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://airflow:airflow@postgres_airflow:5432/airflow

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true


  # ============================================================
  # AIRFLOW WEBSERVER
  # ============================================================

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile

    image: supermarket-airflow:2.10.5
    container_name: supermarket_airflow_webserver

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://airflow:airflow@postgres_airflow:5432/airflow

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./src:/opt/airflow/src

    ports:
      - "8080:8080"

    command: webserver


  # ============================================================
  # AIRFLOW SCHEDULER
  #
  # LocalExecutor ejecuta las tareas aquí.
  # Por eso necesita acceso directo a ./data.
  # ============================================================

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile

    image: supermarket-airflow:2.10.5
    container_name: supermarket_airflow_scheduler

    depends_on:
      airflow-init:
        condition: service_completed_successfully

      data-permissions:
        condition: service_completed_successfully

      spark-master:
        condition: service_started

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://airflow:airflow@postgres_airflow:5432/airflow

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      SPARK_SOURCE_DB_HOST: ${SPARK_SOURCE_DB_HOST}
      SPARK_SOURCE_DB_PORT: ${SPARK_SOURCE_DB_PORT}
      SPARK_SOURCE_DB_NAME: ${SPARK_SOURCE_DB_NAME}
      SPARK_SOURCE_DB_USER: ${SPARK_SOURCE_DB_USER}
      SPARK_SOURCE_DB_PASSWORD: ${SPARK_SOURCE_DB_PASSWORD}

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./src:/opt/airflow/src
      - ./data:/opt/spark-data

    command: scheduler


# ============================================================
# VOLUMES
# ============================================================

volumes:
  source_db_data:
  spark_ivy:
  airflow_postgres_data: